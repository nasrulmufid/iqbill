x-app-env: &app-env
  APP_NAME: ${APP_NAME:-IQ Bill}
  APP_TAGLINE: ${APP_TAGLINE:-Billing RT/RW Net & Management PPPOE Mikrotik REST API}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env before starting Docker Compose}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_STACK: ${LOG_STACK:-daily}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-iqbill}
  DB_USERNAME: ${DB_USERNAME:-iqbill}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Docker Compose}
  SESSION_DRIVER: ${SESSION_DRIVER:-redis}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-true}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  CACHE_STORE: ${CACHE_STORE:-redis}
  CACHE_PREFIX: ${CACHE_PREFIX:-iqbill_}
  REDIS_CLIENT: ${REDIS_CLIENT:-predis}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env before starting Docker Compose}
  REDIS_PORT: ${REDIS_PORT:-6379}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@iqbill.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (min 12 chars) in .env before starting Docker Compose}
  ADMIN_PHONE: ${ADMIN_PHONE:-6281100000000}
  ISP_COMPANY_NAME: ${ISP_COMPANY_NAME:-IQ Bill}
  ISP_COMPANY_ADDRESS: ${ISP_COMPANY_ADDRESS:-Jl. Jend. Sudirman No. 1, Jakarta}
  ISP_COMPANY_PHONE: ${ISP_COMPANY_PHONE:-6281100000001}
  AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
  AUTO_SEED: ${AUTO_SEED:-true}
  GOWA_API_URL: ${GOWA_API_URL:-http://gowa:3000}
  GOWA_BASIC_AUTH_USER: ${GOWA_BASIC_AUTH_USER:-iqbill}
  GOWA_BASIC_AUTH_PASSWORD: ${GOWA_BASIC_AUTH_PASSWORD:?Set GOWA_BASIC_AUTH_PASSWORD in .env before starting Docker Compose}
  GOWA_DEVICE_ID: ${GOWA_DEVICE_ID:-}
  GOWA_AUTO_SYNC: ${GOWA_AUTO_SYNC:-true}
  GOWA_FORCE_SYNC: ${GOWA_FORCE_SYNC:-false}

services:
  web:
    build:
      context: .
      target: web
    container_name: iqbill_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - fpm_sock:/run/php-fpm
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - frontend_net

  app:
    build:
      context: .
      target: app
    container_name: iqbill_app
    restart: unless-stopped
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
    volumes:
      - app_storage:/var/www/html/storage/app
      - fpm_sock:/run/php-fpm
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gowa:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/php-fpm/www.sock || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - db_net
      - egress_net
      - gowa_net

  queue:
    build:
      context: .
      target: app
    container_name: iqbill_queue
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *app-env
      CONTAINER_ROLE: queue
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - db_net
      - egress_net
      - gowa_net

  scheduler:
    build:
      context: .
      target: app
    container_name: iqbill_scheduler
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - db_net
      - egress_net

  db:
    image: mysql:8.0
    container_name: iqbill_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-iqbill}
      MYSQL_USER: ${DB_USERNAME:-iqbill}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Docker Compose}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env before starting Docker Compose}
      TZ: Asia/Jakarta
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - db_net

  redis:
    image: redis:7-alpine
    container_name: iqbill_redis
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env before starting Docker Compose}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - db_net

  gowa:
    # Pin to an explicit release tag (or immutable @sha256 digest via GOWA_IMAGE)
    image: ${GOWA_IMAGE:-aldinokemal2104/go-whatsapp-web-multidevice:v9.10.0}
    container_name: iqbill_gowa
    restart: unless-stopped
    ports:
      - "${GOWA_HOST_BIND:-127.0.0.1}:${GOWA_HOST_PORT:-3000}:3000"
    environment:
      APP_PORT: 3000
      APP_BASIC_AUTH: "${GOWA_BASIC_AUTH_USER:-iqbill}:${GOWA_BASIC_AUTH_PASSWORD:?Set GOWA_BASIC_AUTH_PASSWORD in .env before starting Docker Compose}"
      APP_DEBUG: ${GOWA_DEBUG:-false}
      APP_OS: ${GOWA_DEVICE_OS:-IQ Bill}
      WHATSAPP_ACCOUNT_VALIDATION: ${GOWA_ACCOUNT_VALIDATION:-false}
    volumes:
      - gowa_storages:/app/storages
      - gowa_statics:/app/statics
    networks:
      - gowa_net

volumes:
  app_storage:
  fpm_sock:
  mysql_data:
  redis_data:
  gowa_storages:
  gowa_statics:

networks:
  frontend_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true
  egress_net:
    driver: bridge
  gowa_net:
    driver: bridge
