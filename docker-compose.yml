x-app-env: &app-env
  APP_NAME: ${APP_NAME:-IQ Bill}
  APP_TAGLINE: ${APP_TAGLINE:-Billing RT/RW Net & Management PPPOE Mikrotik REST API}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env before starting Docker Compose}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_STACK: ${LOG_STACK:-daily}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-iqbill}
  DB_USERNAME: ${DB_USERNAME:-iqbill}
  DB_PASSWORD: ${DB_PASSWORD:-change_me_strong_db_password}
  SESSION_DRIVER: ${SESSION_DRIVER:-redis}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-true}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  CACHE_STORE: ${CACHE_STORE:-redis}
  CACHE_PREFIX: ${CACHE_PREFIX:-iqbill_}
  REDIS_CLIENT: ${REDIS_CLIENT:-predis}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_strong_redis_password}
  REDIS_PORT: ${REDIS_PORT:-6379}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@iqbill.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me_min_12_chars}
  ADMIN_PHONE: ${ADMIN_PHONE:-6281100000000}
  ISP_COMPANY_NAME: ${ISP_COMPANY_NAME:-IQ Bill}
  ISP_COMPANY_ADDRESS: ${ISP_COMPANY_ADDRESS:-Jl. Jend. Sudirman No. 1, Jakarta}
  ISP_COMPANY_PHONE: ${ISP_COMPANY_PHONE:-6281100000001}
  AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
  AUTO_SEED: ${AUTO_SEED:-true}
  GOWA_API_URL: ${GOWA_API_URL:-http://gowa:3000}
  GOWA_BASIC_AUTH_USER: ${GOWA_BASIC_AUTH_USER:-iqbill}
  GOWA_BASIC_AUTH_PASSWORD: ${GOWA_BASIC_AUTH_PASSWORD:-change_me_gowa_password}
  GOWA_DEVICE_ID: ${GOWA_DEVICE_ID:-}
  GOWA_AUTO_SYNC: ${GOWA_AUTO_SYNC:-true}
  GOWA_FORCE_SYNC: ${GOWA_FORCE_SYNC:-false}

services:
  web:
    build:
      context: .
      target: web
    container_name: iqbill_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - iqbill_net

  app:
    build:
      context: .
      target: app
    container_name: iqbill_app
    restart: unless-stopped
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gowa:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - iqbill_net

  queue:
    build:
      context: .
      target: app
    container_name: iqbill_queue
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *app-env
      CONTAINER_ROLE: queue
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - iqbill_net

  scheduler:
    build:
      context: .
      target: app
    container_name: iqbill_scheduler
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - iqbill_net

  db:
    image: mysql:8.0
    container_name: iqbill_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-iqbill}
      MYSQL_USER: ${DB_USERNAME:-iqbill}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_strong_db_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_strong_root_password}
      TZ: Asia/Jakarta
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - iqbill_net

  redis:
    image: redis:7-alpine
    container_name: iqbill_redis
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_strong_redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - iqbill_net

  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    container_name: iqbill_gowa
    restart: unless-stopped
    ports:
      - "${GOWA_HOST_BIND:-127.0.0.1}:${GOWA_HOST_PORT:-3000}:3000"
    environment:
      APP_PORT: 3000
      APP_BASIC_AUTH: "${GOWA_BASIC_AUTH_USER:-iqbill}:${GOWA_BASIC_AUTH_PASSWORD:-change_me_gowa_password}"
      APP_DEBUG: ${GOWA_DEBUG:-false}
      APP_OS: ${GOWA_DEVICE_OS:-IQ Bill}
      WHATSAPP_ACCOUNT_VALIDATION: ${GOWA_ACCOUNT_VALIDATION:-false}
    volumes:
      - gowa_storages:/app/storages
      - gowa_statics:/app/statics
    networks:
      - iqbill_net

volumes:
  app_storage:
  mysql_data:
  redis_data:
  gowa_storages:
  gowa_statics:

networks:
  iqbill_net:
    driver: bridge
